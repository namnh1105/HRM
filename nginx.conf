events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Cho phép upload file/video đăng ký khuôn mặt lên đến 50MB (tránh lỗi 413)
    client_max_body_size 50M;

    upstream fe_web {
        server worksphere_web:3000;
    }

    upstream be_api {
        server worksphere:8080;
    }

    server {
        listen 80;
        server_name _; # Hoặc điền domain / IP của bạn (ví dụ: api.yourdomain.com)

        # 1. Các request API backend -> chuyển tiếp tới Spring Boot
        location /api/ {
            proxy_pass http://be_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # 2. Swagger docs của backend (tuỳ chọn)
        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://be_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Toàn bộ giao diện người dùng -> chuyển tiếp tới Next.js Web
        location / {
            proxy_pass http://fe_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
